[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-kyuubi"
version = "0.1.1"
description = "Kyuubi Thrift Python-model submission adapter for dbt-spark"
requires-python = ">=3.9"
dependencies = [
  "dbt-core>=1.12,<1.13",
  "dbt-spark[PyHive]==1.10.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a live Kyuubi, Spark, and Iceberg deployment",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbt.adapters.kyuubi*", "dbt.include.kyuubi*"]
namespaces = true

[tool.setuptools.package-data]
"dbt.include.kyuubi" = ["dbt_project.yml", "macros/**/*.sql"]
