dbt_kyuubi_default_file_format:
  target: integration
  outputs:
    integration:
      type: kyuubi
      method: thrift
      host: "{{ env_var('KYUUBI_HOST', '127.0.0.1') }}"
      port: "{{ env_var('KYUUBI_PORT', '10009') | int }}"
      schema: "{{ env_var('KYUUBI_DBT_TEST_SCHEMA', 'dbt_kyuubi_it') }}"
      user: "{{ env_var('KYUUBI_USER', 'anonymous') }}"
      auth: "{{ env_var('KYUUBI_AUTH', 'NONE') }}"
      threads: 1
      server_side_parameters:
        kyuubi.engine.profile.id: "{{ env_var('KYUUBI_ENGINE_PROFILE_ID') }}"
        spark.sql.defaultCatalog: "{{ env_var('KYUUBI_DEFAULT_CATALOG', 'lakehouse') }}"
